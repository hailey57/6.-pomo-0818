<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main class="settings-card">
    <h3>Setting</h3>

    <div class="form-group">
      <label for="timer-minutes">타이머 시간 (분)</label>
      <input type="number" id="timer-minutes" name="timer-minutes" min="1" max="120" value="25" />
    </div>

    <button type="button" class="btn-confirm" onclick="saveSettings()">설정 완료</button>
  </main>

  <script src="settings.js"></script>
</body>
</html>
