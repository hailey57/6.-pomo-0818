<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>춘천시 넥스텝 컴퓨터 학원</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <main class="timer-card">
    <h1>pomodoro</h1>

    <div id="current-time" class="current-time"></div>

    <div id="time-display" class="time-display">25:00</div>

    <div class="controls">
      <button type="button" class="btn btn-start" onclick="startTimer()">start</button>
      <button type="button" class="btn btn-stop" onclick="stopTimer()">stop</button>
      <button type="button" class="btn btn-reset" onclick="resetTimer()">clear</button>
    </div>

    <button type="button" class="btn-settings" aria-label="설정" onclick="location.href='settings.html'">
      설정
    </button>
  </main>

  <script src="index.js"></script>
</body>

</html>
